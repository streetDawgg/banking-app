spring.application.name=bank-server
server.port=8080

# --- PostgreSQL (override with environment variables if needed) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/bankdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Admin05}

# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- JWT ---
# Dev-only default secret (must be at least 32 characters). Set JWT_SECRET in real use.
bank.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
bank.jwt.expiration-minutes=15

# --- Login lockout ---
bank.security.max-failed-attempts=3
bank.security.lock-seconds=30
